# yaml-language-server: $schema=./quartz/plugins/quartz-plugins.schema.json
configuration:
  pageTitle: 虾宝后花园
  pageTitleSuffix: ""
  enableSPA: true
  enablePopovers: true
  analytics:
    provider: plausible
  locale: zh-CN
  baseUrl: alaricy9528.github.io/xiabao-km
  ignorePatterns:
    - private
    - templates
    - .obsidian
  theme:
    fontOrigin: googleFonts
    cdnCaching: true
    typography:
      header: Oxanium
      body: Noto Sans SC
      code: JetBrains Mono
    colors:
      lightMode:
        light: "#eef4f7"
        lightgray: "#dbe6eb"
        gray: "#8aa0ad"
        darkgray: "#405968"
        dark: "#0b1724"
        secondary: "#087c89"
        tertiary: "#6246c7"
        highlight: rgba(8, 124, 137, 0.1)
        textHighlight: "#5df7ff55"
      darkMode:
        light: "#050713"
        lightgray: "#151c35"
        gray: "#697b96"
        darkgray: "#c7dae6"
        dark: "#eafbff"
        secondary: "#5df7ff"
        tertiary: "#9c82ff"
        highlight: rgba(93, 247, 255, 0.1)
        textHighlight: "#8a63ff66"
plugins:
  - source: "@quartz-community/created-modified-date"
    enabled: true
    options:
      defaultDateType: modified
      priority:
        - frontmatter
        - git
        - filesystem
    order: 10
  - source: "@quartz-community/syntax-highlighting"
    enabled: true
    options:
      theme:
        light: github-light
        dark: github-dark
      keepBackground: false
    order: 20
  - source: "@quartz-community/obsidian-flavored-markdown"
    enabled: true
    options:
      comments: true
      highlight: true
      wikilinks: true
      callouts: true
      mermaid: true
      parseTags: true
      parseArrows: true
      parseBlockReferences: true
      enableInHtmlEmbed: false
      enableYouTubeEmbed: true
      enableVideoEmbed: true
      enableCheckbox: true
    order: 30
  - source: "@quartz-community/github-flavored-markdown"
    enabled: true
    order: 40
  - source: "@quartz-community/table-of-contents"
    enabled: true
    order: 50
    layout:
      position: right
      priority: 30
  - source: "@quartz-community/crawl-links"
    enabled: true
    options:
      markdownLinkResolution: shortest
    order: 60
  - source: "@quartz-community/description"
    enabled: true
    order: 70
  - source: "@quartz-community/latex"
    enabled: true
    options:
      renderEngine: katex
    order: 80
  - source: "@quartz-community/citations"
    enabled: false
    order: 85
  - source: "@quartz-community/hard-line-breaks"
    enabled: true
    order: 90
  - source: "@quartz-community/ox-hugo"
    enabled: false
    order: 91
  - source: "@quartz-community/roam"
    enabled: false
    order: 92
  - source: "@quartz-community/quartz-fonts"
    enabled: true
    options:
      useThemeFonts: false
      fontOrigin: local
      header: Oxanium
      body: Noto Sans SC
      code: JetBrains Mono
      interface: Noto Sans SC
  - source: "@quartz-themes/core"
    enabled: false
    options:
      theme: default
      mode: both
  - source: "@quartz-community/remove-draft"
    enabled: true
  - source: "@quartz-community/explicit-publish"
    enabled: true
  - source: "@quartz-community/unlisted-pages"
    enabled: true
    options: {}
    order: 45
  - source: "@quartz-community/encrypted-pages"
    enabled: true
    options:
      iterations: 600000
      passwordField: password
      unlistWhenEncrypted: false
      outputPath: static/encryptedContentIndex.json
  - source: "@quartz-community/stacked-pages"
    enabled: false
    layout:
      position: afterBody
      priority: 50
      display: all
  - source: "@quartz-community/alias-redirects"
    enabled: true
  - source: "@quartz-community/content-index"
    enabled: true
    options:
      enableSiteMap: true
      enableRSS: true
  - source: "@quartz-community/favicon"
    enabled: true
  - source: "@quartz-community/og-image"
    enabled: true
  - source: "@quartz-community/cname"
    enabled: true
  - source: "@quartz-community/canvas-page"
    enabled: true
  - source: "@quartz-community/content-page"
    enabled: true
  - source: "@quartz-community/folder-page"
    enabled: true
  - source: "@quartz-community/tag-page"
    enabled: true
  - source: "@quartz-community/explorer"
    enabled: true
    options:
      # 左侧菜单只保留学习目录骨架：历史杂项页隐藏，tags 沿用默认隐藏。
      filterFn: (node) => !["发布链路测试", "quartz-v5-+-github-pages-执行方案", "codex-部署-quartz-方案", "quartz-知识库发布方案", "obsidian-公网发布方案"].includes(node.slug) && node.slugSegment !== "tags"
      # 阶段页在菜单里去掉 S-0x 前缀（顺序由 sortFn 保证），总览页保持全名。
      mapFn: (node) => { if (!node.isFolder && node.slug.startsWith("learn/s0")) { node.displayName = node.displayName.replace(/^S-\d+\s*/, "") } return node }
      sortFn: |
        (a, b) => {
          const rank = (n) => (n.isFolder ? 0 : n.slug.startsWith("learn/") ? 1 : 2)
          const ra = rank(a)
          const rb = rank(b)
          if (ra !== rb) return ra - rb
          if (ra === 1) {
            // learn 组内：总览（无 s0x 段）在前，阶段页按 S-01..S-06 数字序
            const stage = (n) => { const m = /\/s0(\d)/.exec(n.slug || ""); return m ? Number(m[1]) : 0 }
            const sa = stage(a)
            const sb = stage(b)
            if (sa !== sb) return sa - sb
          }
          if ((a.isFolder && b.isFolder) || (!a.isFolder && !b.isFolder)) {
            return (a.displayName || "").localeCompare(b.displayName || "", undefined, { numeric: true, sensitivity: "base" })
          }
          return a.isFolder ? -1 : 1
        }
    layout:
      position: left
      priority: 50
  - source: "@quartz-community/graph"
    enabled: true
    options:
      # 右栏星图调优（侧栏渲染的是 localGraph，全屏按钮才是 globalGraph）：
      # 径向布局让 learn 的 hub+六阶段成环更可读；悬停聚焦、加大斥力与
      # 连线距离，避免小面板里挤成一团。
      localGraph:
        enableRadial: true
        focusOnHover: true
        repelForce: 0.7
        centerForce: 0.25
        linkDistance: 42
        scale: 1.15
        fontSize: 0.62
        opacityScale: 0.9
      globalGraph:
        enableRadial: true
        focusOnHover: true
    layout:
      position: right
      priority: 10
  - source: "@quartz-community/search"
    enabled: true
    layout:
      position: left
      priority: 20
      group: toolbar
      groupOptions:
        grow: true
  - source: "@quartz-community/backlinks"
    enabled: true
    layout:
      position: right
      priority: 50
  - source: "@quartz-community/article-title"
    enabled: true
    layout:
      position: beforeBody
      priority: 10
  - source: "@quartz-community/content-meta"
    enabled: true
    layout:
      position: beforeBody
      priority: 20
  - source: "@quartz-community/tag-list"
    enabled: false
    layout:
      position: beforeBody
      priority: 30
  - source: "@quartz-community/page-title"
    enabled: true
    layout:
      position: left
      priority: 10
  - source: "@quartz-community/darkmode"
    enabled: true
    layout:
      position: left
      priority: 30
      group: toolbar
  - source: "@quartz-community/reader-mode"
    enabled: true
    layout:
      position: left
      priority: 35
      group: toolbar
  - source: "@quartz-community/breadcrumbs"
    enabled: true
    layout:
      position: beforeBody
      priority: 5
      condition: not-index
  - source: "@quartz-community/comments"
    enabled: false
    options:
      provider: giscus
      options: {}
    layout:
      position: afterBody
      priority: 10
  - source: "@quartz-community/footer"
    enabled: true
    options:
      links:
        GitHub: https://github.com/alaricy9528/xiabao-km
    layout:
      position: footer
      priority: 50
  - source: "@quartz-community/recent-notes"
    enabled: false
  - source: "@quartz-community/spacer"
    enabled: true
    options: {}
    order: 25
    layout:
      position: left
      priority: 25
      display: mobile-only
  - source: "@quartz-community/bases-page"
    enabled: true
    options: {}
    order: 50
  - source: "@quartz-community/note-properties"
    enabled: true
    options:
      includeAll: false
      includedProperties:
        - description
        - tags
        - aliases
      excludedProperties: []
      hidePropertiesView: false
      delimiters: ---
      language: yaml
    order: 5
    layout:
      position: beforeBody
      priority: 15
      display: all
  - source: "@quartz-community/obsidian-plugin-excalidraw"
    enabled: false
    options:
      enableInteraction: true
      darkMode: auto
      exportPadding: 20
    order: 50
layout:
  groups:
    toolbar:
      priority: 35
      direction: row
      gap: 0.5rem
  byPageType:
    "404":
      positions:
        beforeBody: []
        left: []
        right: []
    content: {}
    folder:
      exclude:
        - reader-mode
      positions:
        right: []
    tag:
      exclude:
        - reader-mode
      positions:
        right: []
    canvas: {}
    bases: {}
