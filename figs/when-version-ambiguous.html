<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>图 · 版本条件不清先别调模型</title>
<link rel="stylesheet" href="_base.css">
</head>
<body>
  <p class="lead">回归挂了，第一反应是换模型；真正缺的其实是<b>判据</b></p>

  <div class="stack">
    <div class="blk">
      <div class="blk-h"><b>01</b><span>两条路，结论完全不同</span></div>
      <div class="fork">
        <div class="fork-item" style="--c:var(--rose)">
          <span class="lb">现在</span>
          <div class="bx"><b>先调模型</b><span>换模型、改排序，判据还是缺，错法只换个样子</span></div>
        </div>
        <div class="fork-item" style="--c:var(--green)">
          <span class="lb">该是</span>
          <div class="bx"><b>先补元数据</b><span>资料补齐、题目写清条件，判据才有得比</span></div>
        </div>
      </div>
    </div>

    <div class="blk">
      <div class="blk-h"><b>02</b><span>补三个字段，一个都不能少</span></div>
      <div class="grid5">
        <div class="chip"><i>01</i>生效时间</div>
        <div class="chip"><i>02</i>失效时间</div>
        <div class="chip"><i>03</i>适用角色</div>
      </div>
      <p class="note">补齐后重跑同一套题；还挂，才轮到查检索排序和向量模型。</p>
    </div>
  </div>

  <p class="say">没有唯一正确答案时，<em>任何排序都判不出对错</em></p>

  <script>
    var t = new URLSearchParams(location.search).get('t');
    if (t === 'dark') document.body.classList.add('dark');
    document.title = 'H=' + Math.ceil(document.body.getBoundingClientRect().height);
  </script>
</body>
</html>
