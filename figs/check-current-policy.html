<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>图 · 前三条命中了哪一版</title>
<link rel="stylesheet" href="_base.css">
</head>
<body>
  <p class="lead">库里同时有现行版和作废版，两个答案<b>看起来都对</b></p>

  <div class="stack">
    <div class="blk">
      <div class="blk-h"><b>01</b><span>顺着管道，分三步查</span><i class="hint">别合成一个总分</i></div>
      <div class="steps">
        <div class="step" style="--c:var(--cyan)">
          <span class="lv">步 01</span>
          <div class="txt"><b>找来源</b><span>正确那份进前三没有？进不去，模型看不到</span></div>
        </div>
        <div class="step" style="--c:var(--cyan)">
          <span class="lv">步 02</span>
          <div class="txt"><b>看答案</b><span>数字对不对？10 日还是 15 日</span></div>
        </div>
        <div class="step" style="--c:var(--cyan)">
          <span class="lv">步 03</span>
          <div class="txt"><b>验引文</b><span>引的是哪一版？指向作废版就是错</span></div>
        </div>
      </div>
      <p class="note">合成一个「准确率」分数，只会知道坏了，不知道坏在哪一段。</p>
    </div>

    <div class="blk">
      <div class="blk-h"><b>02</b><span>题里必须写清条件</span></div>
      <div class="pair">
        <div class="cell ok"><b>写清条件</b><span>生效时间与来源</span></div>
        <div class="cell bad"><b>只说「查制度」</b><span>两个答案都算对</span></div>
      </div>
    </div>
  </div>

  <p class="say">三步都过才算合格，<em>哪步挂了就在哪步修</em></p>

  <script>
    var t = new URLSearchParams(location.search).get('t');
    if (t === 'dark') document.body.classList.add('dark');
    document.title = 'H=' + Math.ceil(document.body.getBoundingClientRect().height);
  </script>
</body>
</html>
